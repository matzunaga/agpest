<!-- Minimal localStorage-backed shim for window.storage so the artifact's
     persistence code works identically when hosted as a plain static page. -->
<script>
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      if (v === null) throw new Error("not found");
      return { key, value: v };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys };
    }
  };
</script>

  const present = new Set(INSTANCES.map((i) => GROUPS[i.group].type));

}

  const state = {};
  Object.keys(MATERIALS_BY_TYPE).forEach((typeId) => {
    state[typeId] = MATERIALS_BY_TYPE[typeId].items.map((text, i) => ({
      id: `${typeId}-default-${i}`,
      text,
      checked: false,
    }));
  });
  return state;
}

      try {
        const saved = await window.storage.get(`materials:${JOB_KEY}`);
        if (saved && saved.value) {
          setMaterialsByType(JSON.parse(saved.value));
        } else {
          setMaterialsByType(defaultMaterialsState());
        }
      } catch (e) {
        setMaterialsByType(defaultMaterialsState());
      }
      try {
        const savedDone = await window.storage.get(`progress:${JOB_KEY}`);
        if (savedDone && savedDone.value) {
          setDone(JSON.parse(savedDone.value));
        }
      } catch (e) {
        // no saved progress yet, that's fine
      }
    })();
  }, []);

  // Persist materials whenever they change (after initial load)
  React.useEffect(() => {
    if (materialsByType === null) return;
    (async () => {
      try {
        const result = await window.storage.set(`materials:${JOB_KEY}`, JSON.stringify(materialsByType));
        setStorageError(!result);
      } catch (e) {
        setStorageError(true);
      }
    })();
  }, [materialsByType]);

  const addMaterialItem = (typeId, text) => {
    const trimmed = text.trim();
    if (!trimmed) return;
    setMaterialsByType((m) => ({
      ...m,
      [typeId]: [...(m[typeId] || []), { id: `${typeId}-${Date.now()}`, text: trimmed, checked: false }],
    }));
  };
  const toggleMaterialItem = (typeId, id) =>
    setMaterialsByType((m) => ({
      ...m,
      [typeId]: m[typeId].map((it) => (it.id === id ? { ...it, checked: !it.checked } : it)),
    }));
  const removeMaterialItem = (typeId, id) =>
    setMaterialsByType((m) => ({
      ...m,
      [typeId]: m[typeId].filter((it) => it.id !== id),
    }));
  const startEditItem = (id, currentText) => {
    setEditingId(id);
    setEditingText(currentText);
  };
  const saveEditItem = (typeId, id) => {
    const trimmed = editingText.trim();
    if (trimmed) {
      setMaterialsByType((m) => ({
        ...m,
        [typeId]: m[typeId].map((it) => (it.id === id ? { ...it, text: trimmed } : it)),
      }));
    }
    setEditingId(null);
    setEditingText("");
  };
  const cancelEditItem = () => {
    setEditingId(null);
    setEditingText("");
  };

  const showAll = () => setVisibleTypes({ sub: true, dry: true, fungus: true });
  const toggleType = (id) => setVisibleTypes((v) => ({ ...v, [id]: !v[id] }));

  const allGroupsOn = GROUP_ORDER.every((id) => visibleGroups[id]);

      {tab === "repair" && (
        <div style={{ padding: 12 }}>
          {GROUP_ORDER.map((id) => {
            const g = GROUPS[id];
            const count = groupCount(id);
            const doneInGroup = INSTANCES.filter((i) => i.group === id && done[i.uid]).length;
            return (
              <div key={id} style={{ border: "1px solid #e5e7eb", borderRadius: 10, padding: 12, marginBottom: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <div style={{ fontWeight: 800, color: "#111827" }}>{id} — {g.location}</div>
                  <span style={{ fontSize: 11, fontWeight: 700, color: g.color }}>{g.label}</span>
                </div>
                <div style={{ fontSize: 11, color: "#6b7280", marginTop: 2 }}>
                  {count} marked location{count > 1 ? "s" : ""} on diagram · {doneInGroup} of {count} done
                </div>
                <ul style={{ margin: "8px 0 0", paddingLeft: 18, fontSize: 13, color: "#374151" }}>
                  {g.repair.map((r, i) => (
                    <li key={i} style={{ marginBottom: 4 }}>{r}</li>
                  ))}
                </ul>
                {g.note && <div style={{ fontSize: 12, color: "#92400e", marginTop: 6, fontStyle: "italic" }}>{g.note}</div>}
              </div>
            );
          })}
        </div>
      )}

      {tab === "materials" && (
        <div style={{ padding: 12 }}>
          <div style={{ fontSize: 12, color: "#6b7280", marginBottom: 12 }}>
            Auto-suggested from what's on this job. Check off what you've got, tap ✎ to edit any item, ✕ to remove it. Saves automatically.
          </div>

          {storageError && (
            <div style={{ background: "#fef2f2", border: "1px solid #fecaca", borderRadius: 8, padding: "8px 10px", fontSize: 12, color: "#b91c1c", marginBottom: 10 }}>
              ⚠ Couldn't save changes — check your connection and try again.
            </div>
          )}

          {materialsByType === null ? (
            <div style={{ fontSize: 13, color: "#9ca3af", padding: "20px 0", textAlign: "center" }}>Loading…</div>
          ) : (
            <>
              {presentTypes.map((t) => {
                const group = MATERIALS_BY_TYPE[t.id];
                const items = materialsByType[t.id] || [];
                return (
                  <div key={t.id} style={{ border: "1px solid #e5e7eb", borderRadius: 10, padding: 12, marginBottom: 12 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
                      <span style={{ width: 10, height: 10, borderRadius: "50%", background: group.color, display: "inline-block" }} />
                      <div style={{ fontWeight: 800, fontSize: 14, color: "#111827" }}>{group.label}</div>
                    </div>
                    {items.length === 0 && (
                      <div style={{ fontSize: 12, color: "#9ca3af", fontStyle: "italic", padding: "4px 0" }}>No items — add one below.</div>
                    )}
                    {items.map((item) => {
                      const isEditing = editingId === item.id;
                      if (isEditing) {
                        return (
                          <div key={item.id} style={{ display: "flex", gap: 6, alignItems: "center", padding: "6px 0" }}>
                            <input
                              autoFocus
                              value={editingText}
                              onChange={(e) => setEditingText(e.target.value)}
                              onKeyDown={(e) => {
                                if (e.key === "Enter") saveEditItem(t.id, item.id);
                                if (e.key === "Escape") cancelEditItem();
                              }}
                              style={{ flex: 1, padding: "6px 8px", borderRadius: 6, border: "1px solid #2563eb", fontSize: 13 }}
                            />
                            <button onClick={() => saveEditItem(t.id, item.id)} style={{ border: "none", background: "#16a34a", color: "#fff", borderRadius: 6, padding: "6px 10px", fontSize: 12, fontWeight: 700 }}>Save</button>
                            <button onClick={cancelEditItem} style={{ border: "none", background: "#e5e7eb", color: "#374151", borderRadius: 6, padding: "6px 10px", fontSize: 12 }}>✕</button>
                          </div>
                        );
                      }
                      return (
                        <div key={item.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0" }}>
                          <label
                            style={{
                              display: "flex",
                              alignItems: "center",
                              gap: 8,
                              fontSize: 13,
                              flex: 1,
                              color: item.checked ? "#9ca3af" : "#374151",
                              textDecoration: item.checked ? "line-through" : "none",
                              cursor: "pointer",
                            }}
                          >
                            <input type="checkbox" checked={item.checked} onChange={() => toggleMaterialItem(t.id, item.id)} style={{ width: 16, height: 16, flexShrink: 0 }} />
                            {item.text}
                          </label>
                          <button onClick={() => startEditItem(item.id, item.text)} style={{ border: "none", background: "none", color: "#9ca3af", fontSize: 14, padding: "2px 4px" }}>✎</button>
                          <button onClick={() => removeMaterialItem(t.id, item.id)} style={{ border: "none", background: "none", color: "#d1d5db", fontSize: 14, padding: "2px 4px" }}>✕</button>
                        </div>
                      );
                    })}
                  </div>
                );
              })}

              <div style={{ border: "1px dashed #d1d5db", borderRadius: 10, padding: 12 }}>
                <div style={{ fontWeight: 700, fontSize: 13, color: "#111827", marginBottom: 8 }}>Add something else</div>
                <div style={{ display: "flex", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
                  {presentTypes.map((t) => (
                    <button
                      key={t.id}
                      onClick={() => setCustomType(t.id)}
                      style={{
                        padding: "5px 10px",
                        borderRadius: 999,
                        fontSize: 11,
                        fontWeight: 700,
                        border: `1px solid ${customType === t.id ? t.color : "#d1d5db"}`,
                        background: customType === t.id ? t.color : "#fff",
                        color: customType === t.id ? "#fff" : "#9ca3af",
                      }}
                    >
                      {t.label}
                    </button>
                  ))}
                </div>
                <div style={{ display: "flex", gap: 6 }}>
                  <input
                    value={customInput}
                    onChange={(e) => setCustomInput(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === "Enter") {
                        addMaterialItem(customType, customInput);
                        setCustomInput("");
                      }
                    }}
                    placeholder="e.g. extra bondo, 2x4 studs..."
                    style={{ flex: 1, padding: "8px 10px", borderRadius: 8, border: "1px solid #d1d5db", fontSize: 13 }}
                  />
                  <button
                    onClick={() => {
                      addMaterialItem(customType, customInput);
                      setCustomInput("");
                    }}
                    style={{ padding: "8px 14px", borderRadius: 8, border: "none", background: "#111827", color: "#fff", fontWeight: 700, fontSize: 13 }}
                  >
                    Add
                  </button>
                </div>
              </div>
            </>
          )}
        </div>
      )}

      {tab === "other" && (
        <div style={{ padding: 12 }}>
          <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 8, color: "#111827" }}>Notes</div>
          {NOTES.map((n) => (
            <div key={n.id} style={{ border: "1px solid #fde68a", background: "#fffbeb", borderRadius: 8, padding: 10, marginBottom: 8 }}>
              <div style={{ fontWeight: 700, fontSize: 12, color: "#92400e" }}>{n.id}</div>
              <div style={{ fontSize: 13, color: "#78350f", marginTop: 2 }}>{n.text}</div>
            </div>
          ))}
          <div style={{ fontWeight: 800, fontSize: 14, margin: "14px 0 8px", color: "#111827" }}>General</div>
          <div style={{ fontSize: 13, color: "#374151" }}>
            One-story single-family residence, stucco exterior, composition roof, attached garage, on slab foundation.
          </div>
          <div style={{ fontSize: 13, color: "#374151", marginTop: 8 }}>
            Guarantees: Fumigation 2 yrs · Local treatment 1 yr (treated area only) · Repair 1 yr · Caulking/grout/sealing of commodes 90 days.
          </div>
          <div style={{ fontSize: 12, color: "#6b7280", marginTop: 8, fontStyle: "italic" }}>
            Roof exterior surface not inspected — contact a licensed roofing contractor for water-tightness. Facia/eave/roof-sheeting repair involving fungus damage may have related roofing leaks not covered by AGPEST.
          </div>
        </div>
      )}

      {tab === "cost" && (
        <div style={{ padding: 12 }}>
          {GROUP_ORDER.map((id) => {
            const g = GROUPS[id];
            const count = groupCount(id);
            return (
              <div key={id} style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", borderBottom: "1px solid #f3f4f6" }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 13, color: "#111827" }}>{id} — {g.location}</div>
                  <div style={{ fontSize: 11, color: g.color, fontWeight: 600 }}>{g.label} · {count} location{count > 1 ? "s" : ""}</div>
                </div>
                <div style={{ fontWeight: 800, fontSize: 14, color: g.cost ? "#111827" : "#9ca3af", textAlign: "right" }}>
                  {g.cost ? `$${g.cost.toLocaleString()}` : g.costNote || "—"}
                </div>
              </div>
            );
          })}
          <div style={{ marginTop: 16, background: "#111827", borderRadius: 10, padding: 14, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ color: "#e5e7eb", fontWeight: 700, fontSize: 13 }}>GRAND TOTAL</div>
            <div style={{ color: "#fff", fontWeight: 900, fontSize: 20 }}>${GRAND_TOTAL.toLocaleString()}</div>
          </div>
          <div style={{ fontSize: 11, color: "#9ca3af", marginTop: 8 }}>
            2A ($1,985) + 3A ($1,875) = $3,860. All of 2B–2G are fumigated/treated in conjunction with 2A at no added cost.
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<BarnwellJob />);
</script>
</body>
</html>
