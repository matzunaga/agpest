// window.storage shim — localStorage-backed, mimics the Claude artifact storage API
// (get/set/delete/list), namespaced under a single prefix so it can't collide
// with other jobs' pages hosted on the same GitHub Pages origin.
(function () {
  const PREFIX = "agpest:5496-waring-rd-16108:";
  window.storage = {
    async get(key) {
      try {
        const raw = localStorage.getItem(PREFIX + key);
        if (raw === null) return null;
        return { key, value: raw, shared: false };
      } catch (e) {
        return null;
      }
    },
    async set(key, value) {
      try {
        localStorage.setItem(PREFIX + key, value);
        return { key, value, shared: false };
      } catch (e) {
        return null;
      }
    },
    async delete(key) {
      try {
        localStorage.removeItem(PREFIX + key);
        return { key, deleted: true, shared: false };
      } catch (e) {
        return null;
      }
    },
    async list(prefix) {
      try {
        const keys = [];
        const full = PREFIX + (prefix || "");
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.indexOf(full) === 0) keys.push(k.slice(PREFIX.length));
        }
        return { keys, prefix: prefix || undefined, shared: false };
      } catch (e) {
        return null;
      }
    },
  };
})();
